# /etc/systemd/system/okx-live@.service.d/hourly-signals.conf  —— 只在“正式切换”时安装，影子期不要装
# 安装后 okx-live@ 的 ExecStartPre（tools/fetch_signals.py）不再下载 GitHub 信号，改为检查并复制
# okx-signals.service 写的 /var/lib/modi-okx-signals/evolve/signals.json（来源、非影子、新鲜度 ≤ 2 小时 15 分、K 线不回退）；
# 跟单程序（okx_demo_trader.signal_timing）同时把 LIVE_SIGNAL_MAX_AGE 改为 2 h 15 min、OPEN_WINDOW 改为 2 h。
# 回退：删除本文件 → systemctl daemon-reload，立刻回到 GitHub 信号（9 h / 5 h）。
# 注意：EnvironmentFile（okx-live.env）里的同名变量优先于这里；不要在 okx-live.env 里写 OKX_SIGNAL_MODE。
# 同一条 ExecStartPre 多传了实例名（--action %i）：过期的每小时信号只挡需要信号的动作（run / resume / follow-current / flatten），
# 不挡 pause 和 snapshot。okx-live-stop（全部平仓并暂停）不经过这里，始终可用。base 单元不改：不装本文件时与现状完全相同。
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/python3 tools/fetch_signals.py --data /var/lib/modi-okx-live --action %i
Environment=OKX_SIGNAL_MODE=hourly
Environment=OKX_HOURLY_SIGNALS=/var/lib/modi-okx-signals/evolve/signals.json
# 实盘优先：H:01:30 信号算完后才触发本服务（串行），这里再给跟单更高的 CPU 权重、更低的 OOM 优先级
CPUWeight=1000
OOMScoreAdjust=-500
