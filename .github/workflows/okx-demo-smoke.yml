name: OKX demo one-shot execution test

on:
  push:
    branches: [master]
    paths: ['.github/workflows/okx-demo-smoke.yml']
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the strategy mirror so both cannot open BTC concurrently.
concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: paper-data
          path: data
      - name: One small demo entry and immediate exit
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: python3 code/tools/okx_demo_smoke.py --output data/okx_demo/smoke-test-20261104.json
      - name: Preserve execution report even if confirmation fails
        if: always()
        working-directory: data
        run: |
          if [ ! -f okx_demo/smoke-test-20261104.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add okx_demo/smoke-test-20261104.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record explicitly requested one-shot OKX demo execution test'
          git push origin paper-data
