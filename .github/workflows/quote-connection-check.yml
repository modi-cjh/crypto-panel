name: Diagnose demo quote transport (read only)

on:
  push:
    branches: [master]
    paths: ['.github/workflows/quote-connection-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets==15.0.1
      - name: Probe demo WebSocket ports and unauthenticated demo REST CORS
        run: python tools/check_quote_connection.py
