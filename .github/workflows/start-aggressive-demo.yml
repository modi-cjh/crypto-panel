name: Start aggressive OKX demo strategy

on:
  push:
    branches: [master]
    paths: ['.github/workflows/start-aggressive-demo.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: paper-data
          path: data
      - name: Check active aggressive window and control state
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'code/tools')
          from volume_test import profile
          if profile()['mode'] != 'aggressive':
              raise SystemExit('Aggressive test window is not active')
          state = json.loads(Path('data/okx_demo/state.json').read_text())
          if (state.get('stop_control') or {}).get('status') in ('pending', 'failed'):
              raise SystemExit('Resolve the previous stop request before restarting')
          PY
      - name: Evaluate strategy signals without resetting account or history
        run: python3 code/tools/paper_trader.py --data data
      - name: Resume demo strategy with aggressive settings
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: python3 code/tools/okx_demo_trader.py --data data --action resume
      - name: Refresh exchange account read-only after execution
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: python3 code/tools/okx_demo_trader.py --data data --action snapshot
      - name: Publish state and execution receipts
        if: always()
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Evaluate aggressive demo signals and publish execution receipts'
          git push origin paper-data
