# Self-evolving strategies on real OKX candles (tools/evolve): each run evolves 5 generations, keeps the
# out-of-sample-qualified champion paper-trading with the backtest engine, and mirrors its positions to OKX demo
# trading (simulated funds; tools/okx_demo_trader.py). Results are committed to the separate `paper-data` branch.
name: Paper trading

on:
  # Every 4 hours (minute 17, UTC 00:17, 04:17, …), kept low on purpose: fewer automated runs and commits on the
  # account. Strategy reruns are idempotent (only new closed bars count), so a delayed or skipped run loses nothing.
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Restart evolution from a fresh random population (keeps cached candles)'
        type: boolean
        default: false
      okx_demo:
        description: 'OKX demo mirror: run (default) / dry-run (log only) / pause / resume / flatten (close all and pause) / follow-current (also open paper positions older than 2h at the current price)'
        type: choice
        options: [run, dry-run, pause, resume, flatten, follow-current]
        default: run

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: code

      - name: Check out the paper-data branch (create it on first run)
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" paper-data >/dev/null; then
            git clone --quiet --depth 1 --branch paper-data "$remote" data
          else
            mkdir data
            git -C data init --quiet -b paper-data
            git -C data remote add origin "$remote"
          fi

      # Self-evolving strategies (tools/evolve): 5 generations per run on real OKX 1H candles, then the qualified
      # champion paper-trades with the same execution engine as the backtests; its positions go to signals.json.
      - name: Evolve strategies and paper-trade the champion
        env:
          RESET: ${{ inputs.reset }}
        run: |
          args=(--data data --generations 5)
          if [ "$RESET" = "true" ]; then args+=(--reset); fi
          python3 code/tools/evolve/run.py "${args[@]}"

      # Mirrors the paper account onto OKX demo trading (simulated funds only). Skips itself when the
      # OKX_* secrets are absent; a failure here never blocks committing the paper results.
      - name: Mirror to OKX demo trading
        continue-on-error: true
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          ACTION: ${{ inputs.okx_demo || 'run' }}
        run: python3 code/tools/okx_demo_trader.py --data data --action "$ACTION"

      - name: Commit results
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit --quiet -m "paper: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin paper-data
