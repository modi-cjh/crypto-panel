# Learning-only paper trading: every hour, replay newly closed OKX 1H candles through two rule sets
# (tools/paper_trader.py) and commit the results to the separate `paper-data` branch.
# Public market data only; no API keys and no orders. master and the dashboard are untouched.
name: Paper trading

on:
  # Twice an hour: GitHub delays or skips scheduled runs, and reruns are idempotent (only new closed bars count).
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Delete all paper-account data and start over'
        type: boolean
        default: false
      backfill_days:
        description: 'Start fresh accounts this many days ago and replay to now (0-90)'
        type: string
        default: '0'
      okx_demo:
        description: 'OKX demo mirror: run (default) / dry-run (log only) / pause / resume / flatten (close all and pause)'
        type: choice
        options: [run, dry-run, pause, resume, flatten]
        default: run

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: code

      - name: Check out the paper-data branch (create it on first run)
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" paper-data >/dev/null; then
            git clone --quiet --depth 1 --branch paper-data "$remote" data
          else
            mkdir data
            git -C data init --quiet -b paper-data
            git -C data remote add origin "$remote"
          fi

      - name: Run the paper trader
        env:
          RESET: ${{ inputs.reset }}
          BACKFILL: ${{ inputs.backfill_days }}
        run: |
          args=(--data data)
          if [ "$RESET" = "true" ]; then args+=(--reset); fi
          if [[ "$BACKFILL" =~ ^[0-9]+$ ]] && [ "$BACKFILL" -gt 0 ]; then args+=(--backfill-days "$BACKFILL"); fi
          python3 code/tools/paper_trader.py "${args[@]}"

      # Mirrors the paper account onto OKX demo trading (simulated funds only). Skips itself when the
      # OKX_* secrets are absent; a failure here never blocks committing the paper results.
      - name: Mirror to OKX demo trading
        continue-on-error: true
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          ACTION: ${{ inputs.okx_demo || 'run' }}
        run: python3 code/tools/okx_demo_trader.py --data data --action "$ACTION"

      - name: Commit results
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit --quiet -m "paper: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin paper-data
