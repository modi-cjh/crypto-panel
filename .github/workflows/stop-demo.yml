name: Stop OKX demo - close program positions and pause

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: paper-data
          path: data
      - name: Pause new entries and close program demo positions
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: python3 code/tools/stop_demo.py --data data
      - name: Publish stop state and receipts even if exchange confirmation fails
        if: always()
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add okx_demo/state.json okx_demo/summary.json okx_demo/actions.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pause OKX demo and publish verified stop result'
          git push origin paper-data
